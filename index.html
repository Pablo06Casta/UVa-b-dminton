<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f2c64" />
    <meta
      name="description"
      content="Web del Club Bádminton Universidad de Valladolid: el club, su historia, el calendario de competiciones y contacto."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Club Bádminton Universidad de Valladolid" />
    <meta
      property="og:description"
      content="Web del Club Bádminton Universidad de Valladolid: el club, su historia, el calendario de competiciones y contacto."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Club Bádminton Universidad de Valladolid" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/images/og-club.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Equipo del Club Bádminton Universidad de Valladolid con la sudadera azul de la UVa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Club Bádminton Universidad de Valladolid" />
    <meta
      name="twitter:description"
      content="Web del Club Bádminton Universidad de Valladolid: el club, su historia, el calendario de competiciones y contacto."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/images/og-club.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsOrganization",
        "name": "Club Bádminton Universidad de Valladolid",
        "sport": "Bádminton",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/images/logo-uva-192.png",
        "parentOrganization": { "@type": "CollegeOrUniversity", "name": "Universidad de Valladolid" },
        "sameAs": ["https://www.instagram.com/uva_bad/"]
      }
    </script>
    <link rel="icon" type="image/png" href="/images/logo-uva-96.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Portada: la imagen principal se pide ya, sin esperar a que cargue la aplicación (es lo más pesado que se ve primero).
      (function () {
        var b = '%BASE_URL%', p = location.pathname;
        if (p === b || p + '/' === b) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.type = 'image/webp';
          l.setAttribute('imagesrcset', b + 'images/equipo-portada-640.webp 640w, ' + b + 'images/equipo-portada-1024.webp 1024w, ' + b + 'images/equipo-portada-1600.webp 1600w');
          l.setAttribute('imagesizes', '100vw');
          document.head.appendChild(l);
        }
      })();
    </script>
    <title>Club Bádminton Universidad de Valladolid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
