# Despliegue en Render (plan gratuito): New → Blueprint → este repositorio.
services:
  - type: web
    name: club-uva-badminton
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OFFICIAL_READ_ENABLED
        value: "true"
      - key: CALENDAR_REFRESH_ENABLED
        value: "true"
      - key: SITE_URL
        value: https://badmiton-uva.github.io/UVa-b-dminton
      - key: CORS_ORIGINS
        value: https://badmiton-uva.github.io
      # La lista del club se construye sola desde el ranking oficial. «declared»: visibles (consentimiento declarado por la administración); los menores quedan ocultos.
      - key: AUTO_ROSTER_CONSENT
        value: declared
      - key: PUBLIC_OPPONENTS
        value: none
      - key: PUBLIC_DRAW_NAMES
        value: initials
      # Copia de la base de datos en Upstash (gratis): evita perder los datos en cada reinicio. Valores de tu cuenta de Upstash.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Opcional: lista del club en CSV (la rellenas tú en Render; no se sube a git).
      - key: ROSTER_CSV
        sync: false
      # Opcional: crónicas de torneos redactadas por IA, con borrador por correo para aprobarlo. Clave de la API de Anthropic y correo del responsable.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHRONICLE_EMAIL
        sync: false
