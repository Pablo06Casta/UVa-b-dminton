name: Pruebas del servidor

on:
  push:
    paths: ['server/**']
  pull_request:
    paths: ['server/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Las pruebas con páginas oficiales reales se omiten aquí: esos ficheros no se suben al repositorio.
      - run: npm test
