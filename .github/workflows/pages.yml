# Publica la web en GitHub Pages: https://<usuario>.github.io/<repositorio>/
# Requiere: Settings → Pages → Source = "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/peaceful-ride-r3scdt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Dirección del servidor del club (Settings → Secrets and variables → Actions → Variables).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # GitHub Pages no reescribe rutas: 404.html sirve la misma app para /historia, /calendario…
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
